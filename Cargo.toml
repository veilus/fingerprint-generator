[workspace]
members = [
    "fingerprint-core",
    "fingerprint-data",
    "fingerprint-rs",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["Veilus <veilusbrowser@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/veilus/fingerprint-generator"
homepage = "https://github.com/veilus/fingerprint-generator"
keywords = ["fingerprint", "browser", "scraping", "antidetect", "bayesian"]
categories = ["web-programming", "simulation"]
readme = "README.md"

[workspace.dependencies]
# Internal
veilus-fingerprint-core = { path = "fingerprint-core", version = "0.2.0" }
veilus-fingerprint-data = { path = "fingerprint-data", version = "0.2.0" }

# External — pin exact versions to ensure reproducibility
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
